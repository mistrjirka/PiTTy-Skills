name: Release profiles
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'mistrjirka/PiTTy-Skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate version and package
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); if (process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Release tag does not match package version");'
          npm run check
          npm test
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
